<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bomber: La Nueva Era</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --pix: 'Press Start 2P', 'Courier New', monospace;
  --bg:#12121f;
  --panel:#232338;
  --panel2:#2e2e47;
  --line:#0a0a12;
  --text:#f2f2f7;
  --dim:#9a9ab8;
  --fire:#ff8a1f;
  --fire2:#ffd23f;
  --c-sergio:#ff4d4d;
  --c-joel:#4d9bff;
  --c-gonzalo:#4dd97a;
  --c-parce:#ffd23f;
  --c-gallo:#b84dff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--pix);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:18px 14px 60px;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size:32px 32px;
}
.wrap{max-width:960px;margin:0 auto}

/* caja pixel */
.pix{
  background:var(--panel);
  border:4px solid var(--line);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.07), 6px 6px 0 rgba(0,0,0,.45);
}

/* cabecera */
header{text-align:center;margin-bottom:22px}
h1{
  font-size:clamp(18px,4.4vw,34px);
  line-height:1.5;
  margin:0;
  letter-spacing:2px;
  color:var(--fire2);
  text-shadow:3px 3px 0 #b32d00, 6px 6px 0 rgba(0,0,0,.55);
}
h1 .era{display:block;font-size:.52em;color:#fff;text-shadow:3px 3px 0 #2a53a8,5px 5px 0 rgba(0,0,0,.5);margin-top:10px}
.tagline{font-size:9px;color:var(--dim);margin-top:14px;line-height:1.9}
.bomb{display:inline-block;animation:tick .9s steps(2,end) infinite}
@keyframes tick{50%{transform:translateY(-4px) rotate(-6deg)}}

/* pestanas */
.tabs{display:flex;gap:10px;justify-content:center;margin:22px 0 20px;flex-wrap:wrap}
.tab{
  font-family:var(--pix);font-size:10px;cursor:pointer;
  padding:14px 18px;color:var(--dim);background:var(--panel2);
  border:4px solid var(--line);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35), 5px 5px 0 rgba(0,0,0,.45);
}
.tab:active{transform:translate(3px,3px)}
.tab.on{background:var(--fire);color:#1a1000}

/* global */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end;margin-bottom:26px}
.pod{padding:12px 8px;text-align:center}
.pod .medal{font-size:22px;display:block;margin-bottom:8px}
.pod .nm{font-size:11px;margin-bottom:8px;word-break:break-word}
.pod .pts{font-size:18px;color:var(--fire2)}
.pod .lbl{font-size:7px;color:var(--dim);margin-top:6px}
.pod.p1{padding-top:26px;padding-bottom:26px}
.pod.p2{padding-top:16px}
.pod.p3{padding-top:10px}

.rank{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px}
.pos{font-size:13px;color:var(--dim);text-align:center}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:26px;height:26px;flex:none;border:3px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35)}
.who .n{font-size:11px}
.bar{height:10px;background:#1a1a2b;border:3px solid var(--line);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .35s steps(12,end)}
.meta{font-size:7px;color:var(--dim);margin-top:7px;line-height:1.7}
.score{font-size:20px;color:var(--fire2);text-align:right;white-space:nowrap}
.score small{display:block;font-size:7px;color:var(--dim);margin-top:6px}

.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.gs{padding:14px;text-align:center}
.gs b{display:block;font-size:17px;color:var(--fire);margin-bottom:8px;line-height:1.4}
.gs span{font-size:7px;color:var(--dim);line-height:1.8}
.gs.has-who b{margin-bottom:3px}
.gs em{display:block;font-style:normal;font-size:9px;color:var(--fire2);margin-bottom:9px;line-height:1.6;word-break:break-word}

/* dias */
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.btn{
  font-family:var(--pix);font-size:9px;cursor:pointer;padding:13px 15px;
  color:#1a1000;background:var(--fire2);border:4px solid var(--line);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.25), 5px 5px 0 rgba(0,0,0,.45);
}
.btn:active{transform:translate(3px,3px)}
.btn.ghost{background:var(--panel2);color:var(--dim)}
.hint{font-size:7px;color:var(--dim);line-height:1.9}

.day{padding:16px;margin-bottom:16px}
.day-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--line);padding-bottom:14px;margin-bottom:14px}
.day-d{font-size:11px;color:var(--fire2);line-height:1.7}
.day-s{font-size:7px;color:var(--dim);margin-top:8px;line-height:1.9}
.day-acts{display:flex;gap:8px}
.mini{font-family:var(--pix);font-size:8px;cursor:pointer;padding:9px 10px;color:var(--dim);background:var(--panel2);border:3px solid var(--line)}
.mini:active{transform:translate(2px,2px)}
.plist{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#1c1c2e;border:3px solid var(--line);padding:10px}
.pl .pn{font-size:10px;flex:1;min-width:70px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl .pv{font-size:15px;color:var(--fire2);min-width:24px;text-align:center}
.crown{font-size:12px}
.winbtn{font-family:var(--pix);font-size:8px;cursor:pointer;padding:10px 12px;color:#1a1000;background:var(--fire);border:3px solid var(--line)}
.winbtn:active{transform:translate(2px,2px)}
.winbtn:disabled{opacity:.3;cursor:not-allowed}
.streak{font-size:7px;background:#3a1f00;color:#ffb347;border:2px solid #5a3000;padding:3px 6px;display:inline-flex;align-items:center;gap:3px;animation:streakPulse .5s steps(2,end) infinite}
@keyframes streakPulse{50%{opacity:.6}}
.closed-badge{display:inline-block;font-size:7px;color:#ffb347;background:#3a1f00;border:2px solid #5a3000;padding:3px 7px;margin-left:8px;vertical-align:middle}
.tl{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tchip{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0a0a12;border:2px solid var(--line);font-family:var(--pix)}
.racha-line{font-size:7px;color:var(--fire2);margin-top:14px;padding-top:14px;border-top:3px solid var(--line);line-height:1.9}
.mini.close{color:#ffb347}
.mini.del{color:#ff6b6b}
.mini:disabled{opacity:.3;cursor:not-allowed}

/* mes */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{background:#1c1c2e;border:3px solid var(--line);padding:9px 10px}
.mrow .top{display:flex;align-items:center;gap:8px}
.mrow .mpos{font-size:9px;color:var(--dim);width:14px;text-align:center}
.mrow .av{width:18px;height:18px;flex:none;border:2px solid var(--line)}
.mrow .mn{font-size:9px;flex:1}
.mrow .mpts{font-size:12px;color:var(--fire2)}
.mbar{height:7px;background:#14141f;border:2px solid var(--line);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%}

/* sub-division por mes dentro de cada tabla de grupo */
.gmonth{margin-top:16px;padding-top:16px;border-top:3px solid var(--line)}
.gmonth:first-child{margin-top:14px;padding-top:0;border-top:none}
.gmonth-h{font-size:8px;color:var(--fire2);margin-bottom:10px;letter-spacing:1px;line-height:1.8}

/* dialogo */
dialog{border:none;background:transparent;padding:0;color:var(--text)}
dialog::backdrop{background:rgba(5,5,12,.82)}
.modal{padding:20px;max-width:440px;width:92vw}
.modal h3{font-size:12px;margin:0 0 18px;color:var(--fire2)}
label.f{display:block;font-size:8px;color:var(--dim);margin:0 0 9px}
input[type=date]{
  font-family:var(--pix);font-size:10px;width:100%;padding:12px;
  background:#1c1c2e;color:var(--text);border:3px solid var(--line);margin-bottom:18px;
}
.chk{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
.chk label{display:flex;align-items:center;gap:8px;font-size:9px;background:#1c1c2e;border:3px solid var(--line);padding:10px;cursor:pointer}
.chk input{width:15px;height:15px;accent-color:#ff8a1f}
.addp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.addp input[type=text]{
  flex:1;min-width:150px;font-family:var(--pix);font-size:9px;padding:11px;
  background:#1c1c2e;color:var(--text);border:3px solid var(--line);
}
.modal-acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{font-size:8px;color:#ff6b6b;margin-bottom:14px;line-height:1.8}

/* ============ INTRO ============ */
.intro{position:fixed;inset:0;z-index:9999;background:#06060c;display:flex;align-items:center;justify-content:center;overflow:hidden}
.intro.out{animation:introOut .55s ease forwards}
@keyframes introOut{to{opacity:0;visibility:hidden}}
body.locked{overflow:hidden}

.igrid{position:absolute;inset:0;display:grid;justify-content:center;align-content:center;gap:4px}
.blk{
  background:#3a3a5c;border:3px solid #14141f;
  box-shadow:inset -5px -5px 0 rgba(0,0,0,.45), inset 5px 5px 0 rgba(255,255,255,.07);
  opacity:0;transform:scale(.2);animation:blkIn .28s steps(3,end) forwards;
}
.blk.hard{background:#20203a;box-shadow:inset -5px -5px 0 rgba(0,0,0,.6), inset 5px 5px 0 rgba(255,255,255,.05)}
@keyframes blkIn{to{opacity:1;transform:scale(1)}}
.blk.blown{animation:blkOut .8s cubic-bezier(.3,.9,.6,1) forwards}
@keyframes blkOut{
  0%{opacity:1}
  100%{opacity:0;transform:translate(var(--bx),var(--by)) rotate(var(--br)) scale(.3)}
}

.ibomb{position:absolute;left:50%;top:50%;margin:-46px 0 0 -46px;width:92px;height:92px;z-index:4;opacity:0}
.ibomb.drop{animation:bombDrop .5s cubic-bezier(.55,0,1,1) forwards}
@keyframes bombDrop{
  0%{opacity:1;transform:translateY(-75vh) scale(.6)}
  75%{opacity:1;transform:translateY(0) scale(1)}
  85%{transform:translateY(0) scale(1.25,.72)}
  93%{transform:translateY(-10px) scale(.92,1.1)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
.ibomb.gone{animation:none !important;opacity:0 !important}
.bball{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 33% 28%, #7b7b9c 0 9%, #26263a 42%, #0a0a12 100%);
  border:4px solid #000;box-shadow:0 0 0 5px #2c2c42, 0 14px 0 rgba(0,0,0,.5);
}
.ibomb.tick .bball{animation:bpulse .28s steps(2,end) infinite}
@keyframes bpulse{50%{transform:scale(1.14)}}
.bshine{position:absolute;left:20%;top:20%;width:15px;height:15px;border-radius:50%;background:#fff;opacity:.9}
.fuse{position:absolute;left:52%;top:-24px;width:8px;height:30px;background:#c8a15a;transform:rotate(14deg);transform-origin:bottom center}
.spark{
  position:absolute;left:calc(52% + 10px);top:-34px;width:16px;height:16px;border-radius:50%;
  background:#ffe98a;box-shadow:0 0 16px 8px rgba(255,138,31,.85);
  animation:sparkle .16s steps(2,end) infinite;
}
@keyframes sparkle{50%{transform:scale(.45) translateY(3px);background:#ff8a1f}}

.cd{position:absolute;left:0;right:0;top:calc(50% - 185px);line-height:1;text-align:center;z-index:5;font-size:clamp(48px,14vw,120px);color:#fff;text-shadow:5px 5px 0 #b32d00,0 0 30px rgba(255,138,31,.8);opacity:0}
.cd.on{animation:cdPop .3s steps(4,end) forwards}
@keyframes cdPop{0%{opacity:1;transform:scale(2.4)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

.blast{position:absolute;left:50%;top:50%;z-index:3;opacity:0}
.blast.go{opacity:1}
.arm{position:absolute;left:0;top:0;background:linear-gradient(90deg,#fff,#ffd23f 25%,#ff8a1f 70%,#b32d00);box-shadow:0 0 60px 18px rgba(255,138,31,.75)}
.blast.go .arm.h{width:0;height:120px;margin-top:-60px;animation:armH .45s steps(7,end) forwards}
.blast.go .arm.v{height:0;width:120px;margin-left:-60px;animation:armV .45s steps(7,end) forwards}
@keyframes armH{0%{width:0;margin-left:0}100%{width:260vw;margin-left:-130vw}}
@keyframes armV{0%{height:0;margin-top:0}100%{height:260vh;margin-top:-130vh}}
.blast.go .core{position:absolute;left:0;top:0;width:0;height:0;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,#ffd23f 55%,rgba(255,138,31,0) 72%);animation:coreOut .55s steps(8,end) forwards}
@keyframes coreOut{0%{width:0;height:0;margin:0}100%{width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;opacity:0}}
.blast.fade{animation:blastFade .7s ease-out forwards}
@keyframes blastFade{to{opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:6;pointer-events:none}
.flash.on{animation:flashOut .5s ease-out forwards}
@keyframes flashOut{0%{opacity:1}100%{opacity:0}}
body.shake{animation:shake .5s steps(2,end) 2}
@keyframes shake{
  0%{transform:translate(0,0)}25%{transform:translate(-9px,5px)}
  50%{transform:translate(8px,-6px)}75%{transform:translate(-5px,-4px)}100%{transform:translate(0,0)}
}

.ititle{position:relative;z-index:7;text-align:center;opacity:0;padding:0 16px}
.ititle.on{animation:slam .45s cubic-bezier(.2,1.7,.35,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(3.2)}65%{opacity:1;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.ititle .l1{font-size:clamp(26px,9vw,66px);color:var(--fire2);letter-spacing:3px;text-shadow:4px 4px 0 #b32d00,8px 8px 0 rgba(0,0,0,.6)}
.ititle .l2{font-size:clamp(12px,3.6vw,26px);color:#fff;margin-top:16px;letter-spacing:2px;text-shadow:3px 3px 0 #2a53a8,6px 6px 0 rgba(0,0,0,.5)}
.iplayers{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.ip{display:flex;align-items:center;gap:8px;font-size:10px;background:rgba(20,20,32,.9);border:3px solid #000;padding:10px 12px;opacity:0;transform:translateY(14px)}
.ip.on{animation:ipIn .28s steps(3,end) forwards}
@keyframes ipIn{to{opacity:1;transform:translateY(0)}}
.ip .sq{width:16px;height:16px;border:3px solid #000}
.iready{margin-top:26px;font-size:clamp(10px,3vw,15px);color:var(--fire);opacity:0}
.iready.on{animation:blink .45s steps(2,end) infinite}
@keyframes blink{50%{opacity:1}0%,100%{opacity:.15}}
.skip{
  position:absolute;right:14px;bottom:14px;z-index:8;font-family:var(--pix);font-size:8px;cursor:pointer;
  color:var(--dim);background:rgba(30,30,48,.9);border:3px solid #000;padding:11px 13px;
}
.skip:hover{color:var(--fire2)}

/* explosion */
.boom{position:fixed;pointer-events:none;width:12px;height:12px;border-radius:50%;z-index:99;animation:boom .45s steps(5,end) forwards}
@keyframes boom{
  0%{box-shadow:0 0 0 0 var(--fire2);opacity:1}
  100%{box-shadow:0 0 0 46px rgba(255,138,31,0);opacity:0}
}
footer{text-align:center;margin-top:34px}
.foot-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;opacity:.6}
.credit{
  margin-top:30px;font-family:var(--pix);font-size:11px;color:#5a5a78;letter-spacing:2px;
}
.credit span{color:var(--fire2);text-shadow:2px 2px 0 rgba(0,0,0,.5)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:7px;color:var(--dim);border:3px solid var(--line);background:var(--panel2);padding:8px 11px}
.live i{width:8px;height:8px;border-radius:50%;background:#77778f}
.live.on{color:#4dd97a}
.live.on i{background:#4dd97a;animation:pulseDot 1.2s steps(2,end) infinite}
.live.off{color:#ffa04d}
.live.off i{background:#ffa04d}
@keyframes pulseDot{50%{opacity:.25}}
/* modo solo lectura: nadie mas toca el marcador */
body.readonly .winbtn,
body.readonly #newDay,
body.readonly .day-acts,
body.readonly #importBtn{display:none}
.empty{padding:26px;text-align:center;font-size:9px;color:var(--dim);line-height:2}
@media(max-width:560px){
  .podium{grid-template-columns:1fr;align-items:stretch}
  .row{grid-template-columns:30px 1fr auto;gap:8px}
  .pl{justify-content:space-between}
}
</style>
</head>
<body class="locked">

<div class="intro" id="intro">
  <div class="igrid" id="igrid"></div>
  <div class="blast" id="blast">
    <i class="arm h"></i><i class="arm v"></i><i class="core"></i>
  </div>
  <div class="ibomb" id="ibomb">
    <span class="fuse"></span><span class="spark"></span>
    <span class="bball"></span><span class="bshine"></span>
  </div>
  <div class="cd" id="cd"></div>
  <div class="ititle" id="ititle">
    <div class="l1">BOMBER</div>
    <div class="l2">NEW ERA</div>
    <div class="iplayers" id="iplayers"></div>
    <div class="iready" id="iready">EL MARCADOR ESTA LISTO</div>
  </div>
  <div class="flash" id="flash"></div>
  <button class="skip" id="skip">SALTAR &#9654;&#9654;</button>
</div>

<div class="wrap">

  <header>
    <h1><span class="bomb">&#128163;</span> BOMBER <span class="era">NEW ERA</span></h1>
  </header>

  <nav class="tabs">
    <button class="tab on" data-tab="global">&#127942; GLOBAL</button>
    <button class="tab" data-tab="grupo">&#128101; POR GRUPO</button>
    <button class="tab" data-tab="mes">&#128198; POR MES</button>
    <button class="tab" data-tab="dias">&#128197; POR DIAS</button>
  </nav>

  <section id="tab-global">
    <div class="podium" id="podium"></div>
    <div class="rank" id="ranking"></div>
    <div class="gstats" id="gstats"></div>
  </section>

  <section id="tab-grupo" hidden>
    <p class="hint" style="margin-bottom:16px">CADA COMBINACION DISTINTA DE JUGADORES TIENE SU PROPIA TABLA</p>
    <div id="groups"></div>
  </section>

  <section id="tab-mes" hidden>
    <div id="months"></div>
  </section>

  <section id="tab-dias" hidden>
    <div class="bar-top">
      <button class="btn" id="newDay">+ NUEVA JORNADA</button>
    </div>
    <div id="days"></div>
  </section>

  <footer>
    <span class="live" id="live" style="display:none"><i></i>CONECTANDO...</span>
    <div class="foot-controls">
      <button class="mini" id="authBtn" hidden>ENTRAR PARA EDITAR</button>
      <button class="mini" id="exportBtn">EXPORTAR</button>
      <button class="mini" id="importBtn">IMPORTAR</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
    <div class="credit">POWERED BY <span>JARBIT</span></div>
  </footer>
</div>

<dialog id="dlg">
  <form method="dialog" class="modal pix">
    <h3 id="dlgTitle">NUEVA JORNADA</h3>
    <label class="f">FECHA DE LA JORNADA</label>
    <input type="date" id="fDate">
    <label class="f">QUIENES JUGARON</label>
    <div class="chk" id="fPlayers"></div>
    <label class="f">SE UNIO ALGUIEN MAS?</label>
    <div class="addp">
      <input type="text" id="fOtroName" placeholder="NOMBRE DEL INVITADO" maxlength="20">
      <button class="mini" type="button" id="fOtroAdd">+ AGREGAR</button>
    </div>
    <p class="err" id="fErr" hidden></p>
    <div class="modal-acts">
      <button class="btn ghost" type="submit" value="cancel">CANCELAR</button>
      <button class="btn" id="fSave" type="button">GUARDAR</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'bomber-nueva-era-v2';

const PLAYERS = [
  { id:'sergio',  name:'SERGIO',  color:'var(--c-sergio)'  },
  { id:'joel',    name:'JOEL',    color:'var(--c-joel)'    },
  { id:'gonzalo', name:'GONZALO', color:'var(--c-gonzalo)' },
  { id:'parce',   name:'PARCE',   color:'var(--c-parce)'   },
  { id:'gallo',   name:'GALLO',   color:'var(--c-gallo)'   }
];
/* colores para invitados que se agreguen sobre la marcha, sin pisar los fijos */

/* busca en los fijos y tambien en los invitados que se hayan agregado */
const pById = id => PLAYERS.find(p => p.id === id) || (state.customPlayers || []).find(p => p.id === id);
const allPlayers = () => PLAYERS.concat(state.customPlayers || []);

/* cada jornada guarda "order": el orden real en que se gano cada partida.
   de ahi se calculan solos los puntos y la racha mas larga. */
const SEED = {
  days: [
    { id:'d1', date:'2026-08-18',
      players:['sergio','joel','gonzalo','parce'],
      order:['sergio','joel','gonzalo','sergio','gonzalo'],
      closed:false }
  ],
  customPlayers: [] // invitados que se van agregando desde "NUEVA JORNADA"
};

let state = load();
let editing = null;

/* compatibilidad: si llega una jornada vieja con "wins" en vez de "order",
   o sin "closed", la arregla para que no truene nada */
function normalizeDay(d){
  if(!Array.isArray(d.order)){
    const arr = [];
    if(d.wins){
      Object.keys(d.wins).forEach(p => {
        for(let i=0;i<(d.wins[p]||0);i++) arr.push(p);
      });
    }
    d.order = arr;
  }
  if(typeof d.closed !== 'boolean') d.closed = false;
  delete d.wins;
  return d;
}
function normalizeState(s){
  if(!s) return s;
  if(Array.isArray(s.days)) s.days = s.days.map(normalizeDay);
  if(!Array.isArray(s.customPlayers)) s.customPlayers = [];
  return s;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return normalizeState(JSON.parse(JSON.stringify(SEED)));
    const d = JSON.parse(raw);
    return (d && Array.isArray(d.days)) ? normalizeState(d) : normalizeState(JSON.parse(JSON.stringify(SEED)));
  }catch(e){
    return normalizeState(JSON.parse(JSON.stringify(SEED)));
  }
}
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    // navegador sin almacenamiento: al menos que el marcador siga vivo en pantalla
  }
  cloudPush();
  render();
}

function sortedDays(){
  return state.days.slice().sort((a,b) => b.date.localeCompare(a.date));
}
function orderToWins(order){
  const w = {};
  (order || []).forEach(pid => { w[pid] = (w[pid] || 0) + 1; });
  return w;
}
function dayTotal(d){
  return (d.order || []).length;
}
/* racha mas larga dentro de una secuencia de ganadores: cuantas seguidas
   gano el mismo jugador, y quien(es) llegaron a ese maximo */
function longestStreak(order){
  let bestLen = 0, bestHolders = [];
  let curLen = 0, curPid = null;
  (order || []).forEach(pid => {
    if(pid === curPid) curLen++;
    else { curPid = pid; curLen = 1; }
    if(curLen > bestLen){ bestLen = curLen; bestHolders = [curPid]; }
    else if(curLen === bestLen && !bestHolders.includes(curPid)) bestHolders.push(curPid);
  });
  return { len:bestLen, holders:bestHolders };
}
/* racha que esta corriendo ahora mismo (las ultimas partidas seguidas del
   mismo jugador), para el badge en vivo mientras se edita una jornada */
function currentStreak(order){
  const o = order || [];
  if(!o.length) return { len:0, pid:null };
  const pid = o[o.length - 1];
  let len = 0;
  for(let i = o.length - 1; i >= 0; i--){
    if(o[i] === pid) len++; else break;
  }
  return { len, pid };
}
function streakLabel(r){
  if(r.len <= 1) return 'RACHA MAS LARGA: 1 (nadie repitio consecutiva)';
  return 'RACHA MAS LARGA: ' + r.len + 'x &mdash; ' + r.holders.map(h => {
    const p = pById(h); return p ? p.name : h;
  }).join(', ');
}
function globalBestStreak(){
  let bestLen = 0, bestHolders = [], bestDate = null;
  state.days.forEach(d => {
    const r = longestStreak(d.order);
    if(r.len > bestLen){ bestLen = r.len; bestHolders = r.holders; bestDate = d.date; }
  });
  return { len:bestLen, holders:bestHolders, date:bestDate };
}
function totals(){
  const t = {};
  allPlayers().forEach(p => t[p.id] = { pts:0, jugadas:0, jornadas:0, ganadas:0 });
  state.days.forEach(d => {
    const w = orderToWins(d.order);
    const tot = dayTotal(d);
    let max = 0;
    d.players.forEach(p => { max = Math.max(max, w[p] || 0); });
    d.players.forEach(p => {
      if(!t[p]) return;
      t[p].pts      += w[p] || 0;
      t[p].jugadas  += tot;
      t[p].jornadas += 1;
      if(max > 0 && (w[p] || 0) === max) t[p].ganadas += 1;
    });
  });
  const fixedIds = PLAYERS.map(p => p.id);
  return allPlayers().map(p => Object.assign({}, p, t[p.id]))
    .filter(r => fixedIds.indexOf(r.id) > -1 || r.jornadas > 0) // a los invitados solo se les muestra si ya jugaron
    .sort((a,b) => b.pts - a.pts || b.ganadas - a.ganadas || a.name.localeCompare(b.name));
}

const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
const DIAS  = ['DOMINGO','LUNES','MARTES','MIERCOLES','JUEVES','VIERNES','SABADO'];
function fmt(iso){
  const parts = iso.split('-').map(Number);
  const dt = new Date(parts[0], parts[1]-1, parts[2]);
  return DIAS[dt.getDay()] + ' ' + parts[2] + ' DE ' + MESES[parts[1]-1] + ' ' + parts[0];
}

/* la de racha se ve mejor con el numero grande arriba y el nombre debajo,
   en vez de todo apretado en una sola linea */

function dayCardHTML(d){
  const order = d.order || [];
  const w = orderToWins(order);
  const tot = order.length;
  let max = 0;
  d.players.forEach(p => { max = Math.max(max, w[p] || 0); });
  const editable = canEdit && !d.closed;
  const cur = editable ? currentStreak(order) : { len:0, pid:null };
  const lista = d.players.slice().sort((a,b) => (w[b]||0) - (w[a]||0));

  const filas = lista.map(pid => {
    const p = pById(pid);
    if(!p) return '';
    const pv = w[pid] || 0;
    const rey = (max > 0 && pv === max) ? '<span class="crown">&#128081;</span>' : '';
    const racha = (cur.len >= 2 && cur.pid === pid) ? '<span class="streak">&#128293; x' + cur.len + '</span>' : '';
    const winBtn = editable ? '<button class="winbtn" data-act="win" data-day="' + d.id + '" data-p="' + pid + '">GANO</button>' : '';
    return '<div class="pl">' +
      '<span class="av" style="background:' + p.color + '"></span>' +
      '<span class="pn" style="color:' + p.color + '">' + p.name + rey + racha + '</span>' +
      '<span class="pv">' + pv + '</span>' +
      winBtn +
    '</div>';
  }).join('');

  const timeline = tot ? '<div class="tl">' + order.map(pid => {
    const p = pById(pid);
    return '<span class="tchip" style="background:' + (p ? p.color : '#555') + '" title="' + (p ? p.name : pid) + '">' + (p ? p.name[0] : '?') + '</span>';
  }).join('') + '</div>' : '';

  const rachaLine = tot ? '<div class="racha-line">&#128293; ' + streakLabel(longestStreak(order)) + '</div>' : '';

  const acts = [];
  if(editable){
    acts.push('<button class="mini" data-act="undo" data-day="' + d.id + '"' + (tot ? '' : ' disabled') + '>&#8617; DESHACER</button>');
    acts.push('<button class="mini close" data-act="close" data-day="' + d.id + '">CERRAR JORNADA</button>');
  }
  if(canEdit){
    // la fecha y quienes jugaron se pueden corregir aunque este cerrada;
    // lo unico que queda bloqueado al cerrar son los puntos (GANO/DESHACER)
    acts.push('<button class="mini" data-act="edit" data-day="' + d.id + '">EDITAR</button>');
  }

  const badge = d.closed ? '<span class="closed-badge">&#128274; CERRADA</span>' : '';

  return '<div class="day pix">' +
    '<div class="day-h"><div>' +
      '<div class="day-d">' + fmt(d.date) + badge + '</div>' +
      '<div class="day-s">' + d.players.length + ' JUGADORES &middot; ' + tot + ' PARTIDAS</div>' +
    '</div><div class="day-acts">' + acts.join('') + '</div></div>' +
    '<div class="plist">' + filas + '</div>' +
    timeline +
    rachaLine +
  '</div>';
}

function monthKey(iso){ return iso.slice(0,7); } // YYYY-MM
function monthLabel(key){
  const parts = key.split('-').map(Number);
  return MESES[parts[1]-1] + ' ' + parts[0];
}
function renderMonths(){
  const box = document.getElementById('months');
  if(!state.days.length){
    box.innerHTML = '<div class="empty pix">TODAVIA NO HAY JORNADAS</div>';
    return;
  }
  const hoyKey = new Date().toISOString().slice(0,7); // el navegador mira la fecha de hoy solo
  const byMonth = {};
  state.days.forEach(d => {
    const k = monthKey(d.date);
    (byMonth[k] = byMonth[k] || []).push(d);
  });
  const keys = Object.keys(byMonth).sort().reverse();

  box.innerHTML = keys.map(k => {
    const dds = byMonth[k];
    const t = {};
    allPlayers().forEach(p => t[p.id] = { pts:0, jugadas:0 });
    let partidas = 0, bestLen = 0, bestHolders = [];
    dds.forEach(d => {
      const w = orderToWins(d.order);
      const tot = dayTotal(d);
      partidas += tot;
      d.players.forEach(p => { if(t[p]){ t[p].pts += w[p] || 0; t[p].jugadas += tot; } });
      const r = longestStreak(d.order);
      if(r.len > bestLen){ bestLen = r.len; bestHolders = r.holders; }
    });
    const rows = allPlayers().map(p => Object.assign({}, p, t[p.id]))
      .filter(r => r.jugadas > 0)
      .sort((a,b) => b.pts - a.pts || a.name.localeCompare(b.name));
    const maxPts = Math.max(1, rows[0] ? rows[0].pts : 1);
    const filas = rows.map((r,i) => {
      const pct = Math.round(r.pts / maxPts * 100);
      return '<div class="mrow"><div class="top">' +
        '<span class="mpos">' + (i+1) + '</span>' +
        '<span class="av" style="background:' + r.color + '"></span>' +
        '<span class="mn" style="color:' + r.color + '">' + r.name + '</span>' +
        '<span class="mpts">' + r.pts + '</span>' +
      '</div><div class="mbar"><i style="width:' + pct + '%;background:' + r.color + '"></i></div></div>';
    }).join('');
    const rachaTxt = bestLen >= 2
      ? (bestLen + 'x &middot; ' + bestHolders.map(h => { const p = pById(h); return p ? p.name : h; }).join(', '))
      : '-';
    const actualBadge = (k === hoyKey) ? '<span class="closed-badge">&#9203; MES ACTUAL</span>' : '';
    return '<div class="day pix">' +
      '<div class="day-h"><div>' +
        '<div class="day-d">' + monthLabel(k) + actualBadge + '</div>' +
        '<div class="day-s">' + dds.length + ' JORNADAS &middot; ' + partidas + ' PARTIDAS &middot; RACHA: ' + rachaTxt + '</div>' +
      '</div></div>' +
      '<div class="mlist">' + filas + '</div>' +
    '</div>';
  }).join('');
}

/* agrupa las jornadas por el conjunto exacto de jugadores que participo:
   si un dia falta parce, o si se suma gallo, es una combinacion distinta
   y arma su propia tabla, separada del resto */
function groupKey(players){
  return players.slice().sort().join('|');
}
/* arma la fila de ranking chiquita que se reusa en POR MES y dentro de cada
   sub-mes de POR GRUPO */
function rankRowsHTML(rows){
  const maxPts = Math.max(1, rows[0] ? rows[0].pts : 1);
  return rows.map((r,i) => {
    const pct = Math.round(r.pts / maxPts * 100);
    return '<div class="mrow"><div class="top">' +
      '<span class="mpos">' + (i+1) + '</span>' +
      '<span class="av" style="background:' + r.color + '"></span>' +
      '<span class="mn" style="color:' + r.color + '">' + r.name + '</span>' +
      '<span class="mpts">' + r.pts + '</span>' +
    '</div><div class="mbar"><i style="width:' + pct + '%;background:' + r.color + '"></i></div></div>';
  }).join('');
}

function renderGroups(){
  const box = document.getElementById('groups');
  if(!state.days.length){
    box.innerHTML = '<div class="empty pix">TODAVIA NO HAY JORNADAS</div>';
    return;
  }
  const hoyKey = new Date().toISOString().slice(0,7);
  const byGroup = {};
  state.days.forEach(d => {
    const k = groupKey(d.players);
    (byGroup[k] = byGroup[k] || { players: d.players, days: [] }).days.push(d);
  });
  const groups = Object.keys(byGroup).map(k => byGroup[k]).sort((a,b) => {
    const da = a.days.reduce((m,d) => d.date > m ? d.date : m, '');
    const db = b.days.reduce((m,d) => d.date > m ? d.date : m, '');
    return db.localeCompare(da);
  });

  box.innerHTML = groups.map(g => {
    const dds = g.days;
    // los del grupo, en el orden natural del roster + invitados
    const order = allPlayers().map(p => p.id).filter(id => g.players.indexOf(id) > -1);
    const groupLabel = order.map(id => { const p = pById(id); return p ? p.name : id; }).join(' + ');

    let partidas = 0, bestLen = 0, bestHolders = [];
    dds.forEach(d => {
      partidas += dayTotal(d);
      const r = longestStreak(d.order);
      if(r.len > bestLen){ bestLen = r.len; bestHolders = r.holders; }
    });
    const rachaTxt = bestLen >= 2
      ? (bestLen + 'x &middot; ' + bestHolders.map(h => { const p = pById(h); return p ? p.name : h; }).join(', '))
      : '-';

    // dentro del grupo, se separa por mes: si el mismo grupo juega en meses
    // distintos, cada mes tiene su propia mini-tabla
    const byMonth = {};
    dds.forEach(d => (byMonth[monthKey(d.date)] = byMonth[monthKey(d.date)] || []).push(d));
    const monthsHTML = Object.keys(byMonth).sort().reverse().map(mk => {
      const mdds = byMonth[mk];
      const t = {};
      order.forEach(id => t[id] = { pts:0, jugadas:0 });
      let mpartidas = 0;
      mdds.forEach(d => {
        const w = orderToWins(d.order);
        const tot = dayTotal(d);
        mpartidas += tot;
        d.players.forEach(p => { if(t[p]){ t[p].pts += w[p] || 0; t[p].jugadas += tot; } });
      });
      const rows = order.map(id => Object.assign({}, pById(id), t[id]))
        .sort((a,b) => b.pts - a.pts || a.name.localeCompare(b.name));
      const actualBadge = (mk === hoyKey) ? '<span class="closed-badge">&#9203; MES ACTUAL</span>' : '';
      return '<div class="gmonth">' +
        '<div class="gmonth-h">' + monthLabel(mk) + actualBadge + '<br>' + mdds.length + ' JORNADAS &middot; ' + mpartidas + ' PARTIDAS</div>' +
        '<div class="mlist">' + rankRowsHTML(rows) + '</div>' +
      '</div>';
    }).join('');

    return '<div class="day pix">' +
      '<div class="day-h"><div>' +
        '<div class="day-d">' + groupLabel + '</div>' +
        '<div class="day-s">' + dds.length + ' JORNADAS EN TOTAL &middot; ' + partidas + ' PARTIDAS &middot; RACHA: ' + rachaTxt + '</div>' +
      '</div></div>' +
      monthsHTML +
    '</div>';
  }).join('');
}

function boom(el){
  const r = el.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'boom';
  s.style.left = (r.left + r.width/2 - 6) + 'px';
  s.style.top  = (r.top + r.height/2 - 6) + 'px';
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 500);
  sfx('pop');
}

document.getElementById('days').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if(!b || !canEdit) return;
  const d = state.days.filter(x => x.id === b.dataset.day)[0];
  if(!d) return;
  const act = b.dataset.act;
  const editable = !d.closed;

  if(act === 'win'){
    if(!editable) return;
    d.order = d.order || [];
    d.order.push(b.dataset.p);
    boom(b);
    save();
  } else if(act === 'undo'){
    if(!editable || !d.order || !d.order.length) return;
    d.order.pop();
    save();
  } else if(act === 'close'){
    if(d.closed) return;
    if(confirm('Cerrar la jornada del ' + fmt(d.date) + '? Ya no vas a poder anotar mas partidas ni editar quienes jugaron.')){
      d.closed = true;
      save();
    }
  } else if(act === 'edit'){
    if(!canEdit) return;
    openDialog(d);
  }
});

  const known = PLAYERS.concat(state.customPlayers || [], pendingGuests);
  const dup = known.find(p => p.name === name.toUpperCase());

    return;
  }
  const color = GUEST_COLORS[(state.customPlayers.length + pendingGuests.length) % GUEST_COLORS.length];
  const guest = { id: 'g' + Date.now().toString(36), name: name.toUpperCase(), color };
  pendingGuests.push(guest);
  document.getElementById('fPlayers').insertAdjacentHTML('beforeend', playerCheckboxHTML(guest, true));
  inp.value = '';
});

document.getElementById('fSave').addEventListener('click', () => {
  const date = document.getElementById('fDate').value;
  const sel = Array.prototype.slice.call(document.querySelectorAll('#fPlayers input:checked')).map(i => i.value);
  const err = document.getElementById('fErr');
  if(!date){ err.textContent = 'PON UNA FECHA'; err.hidden = false; return; }
  if(!sel.length){ err.textContent = 'ELIGE AL MENOS UN JUGADOR'; err.hidden = false; return; }
  const choque = state.days.filter(d => d.date === date && (!editing || d.id !== editing.id))[0];
  if(choque){ err.textContent = 'YA EXISTE UNA JORNADA ESE DIA'; err.hidden = false; return; }
  if(editing && editing.closed){
    // en una cerrada se puede corregir fecha o sumar a alguien que se te paso,
    // pero no quitar a quien ya tiene partidas ganadas ahi
    const w = orderToWins(editing.order);
    const perdidos = Object.keys(w).filter(pid => w[pid] > 0 && sel.indexOf(pid) === -1);
    if(perdidos.length){
      err.textContent = 'NO PUEDES QUITAR A QUIEN YA TIENE PARTIDAS GANADAS EN UNA JORNADA CERRADA';
      err.hidden = false;
      return;
    }
  }

  // recien ahora quedan confirmados los invitados nuevos que se marcaron
  pendingGuests.forEach(g => {
    if(sel.indexOf(g.id) > -1 && !state.customPlayers.find(p => p.id === g.id)){
      state.customPlayers.push(g);
    }
  });
  pendingGuests = [];

  if(editing){
    editing.date = date;
    editing.players = sel;
    // si sacas a alguien que ya tenia partidas ganadas, esas partidas se pierden del historial
    editing.order = (editing.order || []).filter(pid => sel.indexOf(pid) > -1);
  } else {
    state.days.push({ id:'d' + Date.now(), date:date, players:sel, order:[], closed:false });
  }
  editing = null;
  dlg.close();
  save();
});
dlg.addEventListener('close', () => { editing = null; pendingGuests = []; });

/* ============ SONIDO ============ */
let AC = null;
function ac(){
  if(AC) return AC;
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  return AC;
}
function tone(freq, dur, type, vol, slide){
  const c = ac();
  if(!c || c.state !== 'running') return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, c.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, c.currentTime + dur);
  g.gain.setValueAtTime(vol || .08, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
  o.connect(g).connect(c.destination);
  o.start(); o.stop(c.currentTime + dur);
}
function sfx(kind){
  const c = ac();
  if(!c || c.state !== 'running') return;
  if(kind === 'tick'){ tone(1200, .07, 'square', .05); }
  else if(kind === 'pop'){ tone(520, .12, 'triangle', .09, 1300); }
  else if(kind === 'thud'){ tone(140, .18, 'sine', .16, 50); }
  else if(kind === 'boom'){
    tone(90, .7, 'sawtooth', .22, 28);
    const len = Math.floor(c.sampleRate * .55);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'lowpass';
    f.frequency.setValueAtTime(2400, c.currentTime);
    f.frequency.exponentialRampToValueAtTime(160, c.currentTime + .55);
    g.gain.setValueAtTime(.35, c.currentTime);
    s.connect(f).connect(g).connect(c.destination);
    s.start();
  }
  else if(kind === 'ready'){
    [523,659,784,1046].forEach((f,i) => setTimeout(() => tone(f, .16, 'square', .07), i*90));
  }
}
document.addEventListener('pointerdown', () => {
  const c = ac();
  if(c && c.state === 'suspended') c.resume();
});

/* ============ INTRO ============ */
(function intro(){
  const box = document.getElementById('intro');
  const grid = document.getElementById('igrid');
  const bomb = document.getElementById('ibomb');
  const timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  function end(){
    timers.forEach(clearTimeout);
    box.classList.add('out');
    document.body.classList.remove('locked','shake');
    setTimeout(() => box.remove(), 600);
  }
  document.getElementById('skip').addEventListener('click', end);
  document.addEventListener('keydown', function esc(e){
    if(!document.getElementById('intro')) return;
    if(e.key === 'Escape' || e.key === ' ' || e.key === 'Enter'){ end(); }
  });

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ end(); return; }

  // tablero de bloques
  const cell = window.innerWidth < 560 ? 44 : 60;
  const cols = Math.ceil(window.innerWidth / cell) + 1;
  const rows = Math.ceil(window.innerHeight / cell) + 1;
  grid.style.gridTemplateColumns = 'repeat(' + cols + ',' + cell + 'px)';
  grid.style.gridAutoRows = cell + 'px';
  const blocks = [];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const b = document.createElement('div');
      b.className = 'blk' + ((r%2===1 && c%2===1) ? ' hard' : '');
      b.style.animationDelay = ((r+c) * 16) + 'ms';
      grid.appendChild(b);
      blocks.push(b);
    }
  }

  // linea de tiempo
  at(500,  () => { bomb.classList.add('drop'); });
  at(950,  () => { sfx('thud'); bomb.classList.add('tick'); });

  const cd = document.getElementById('cd');
  [3,2,1].forEach((n,i) => {
    at(1100 + i*320, () => {
      cd.textContent = n;
      cd.classList.remove('on');
      void cd.offsetWidth;
      cd.classList.add('on');
      sfx('tick');
    });
  });

  at(2060, () => {
    sfx('boom');
    bomb.classList.add('gone');
    document.getElementById('blast').classList.add('go');
    document.getElementById('flash').classList.add('on');
    document.body.classList.add('shake');
    blocks.forEach(b => {
      b.style.setProperty('--bx', (Math.random()*220 - 110) + 'vw');
      b.style.setProperty('--by', (Math.random()*180 - 130) + 'vh');
      b.style.setProperty('--br', (Math.random()*720 - 360) + 'deg');
      b.classList.add('blown');
    });
  });

  at(2500, () => { document.getElementById('blast').classList.add('fade'); });

  at(2560, () => {
    document.body.classList.remove('shake');
    document.getElementById('ititle').classList.add('on');
  });

  const ipl = document.getElementById('iplayers');
  ipl.innerHTML = PLAYERS.map(p =>
    '<span class="ip"><span class="sq" style="background:' + p.color + '"></span>' +
    '<span style="color:' + p.color + '">' + p.name + '</span></span>'
  ).join('');
  const chips = ipl.querySelectorAll('.ip');
  chips.forEach((ch,i) => at(2950 + i*170, () => { ch.classList.add('on'); sfx('pop'); }));

  at(2950 + chips.length*170 + 200, () => {
    document.getElementById('iready').classList.add('on');
    sfx('ready');
  });
  at(2950 + chips.length*170 + 1500, end);
})();
